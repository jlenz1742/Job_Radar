name: Job-Radar

on:
  schedule:
    - cron: '0 5 * * 1-5'      # werktags 07:00 Schweizer Zeit (Sommerzeit)
  workflow_dispatch:            # manuell ausloesbar, z.B. zum Testen

permissions:
  contents: write
  issues: write        # fuer die taegliche Zusammenfassung als Issue

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Braucht ein echtes Netzwerk ohne HTTPS-Tunnel-Proxy -- lief in der
      # Entwicklungs-Sandbox deshalb nur mit --kein-js. Auf einem GitHub-
      # Actions-Runner (kein Proxy) sollte das kein Problem sein.
      - run: playwright install --with-deps chromium

      - name: Karriereseiten + jobs.ch abrufen
        run: python abruf.py run --prio 1 --pause 1 | tee abruf.log

      # Laeuft immer -- parser/mail.py faengt IMAP-Fehler (auch fehlende
      # Secrets) selbst ab und liefert dann nur einen FEHLER-Eintrag statt
      # abzustuerzen (sichtbar im Quellen-Waechter unten, kein stiller Ausfall).
      - name: Alert-Mails auslesen
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
        run: |
          python parser/mail.py --seit 2 --out lauf_mail.json
          python radar.py ingest lauf_mail.json | tee -a abruf.log

      - name: Excel neu bauen
        run: python radar.py excel Job_Radar.xlsx

      - name: Zustand zurueckschreiben
        run: |
          git config user.name  "job-radar"
          git config user.email "actions@github.com"
          git add state.json Job_Radar.xlsx laeufe/
          git diff --staged --quiet || git commit -m "Lauf $(date -u +%Y-%m-%d)"
          git push

      # Uebersicht (neue Jobs, letzte 3 Tage) + Shortlist (Claude-Bewertung
      # der vorgefilterten Kandidaten gegen Jans Profil aus CLAUDE.md) als
      # GitHub Issue. Eigener Schritt, eigenes try/except im Skript -- ein
      # API-Fehler hier soll den Lauf nicht rot machen, der Kern (Daten
      # abrufen + committen) ist zu dem Zeitpunkt schon durch.
      - name: Taegliche Zusammenfassung
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/bericht.py

      # Der Lauf muss SICHTBAR scheitern, wenn Quellen ausfallen -- aber nur
      # bei NEUEN Fehlern. Ein paar Quellen sind dauerhaft durch Bot-Abwehr
      # blockiert (daten/bekannte_fehler.txt); die taeglich erneut rot zu
      # melden waere genau das stille Wegklicken, das Regel 4 verhindern
      # soll. Nur eine Quelle, die NICHT auf der Liste steht, ist ein
      # echtes neues Signal.
      - name: Quellen-Waechter
        run: |
          echo "--- Fehlerhafte Quellen dieses Laufs ---"
          grep '!!' abruf.log || echo "(keine)"

          bekannt() {
            grep -vE '^\s*#|^\s*$' daten/bekannte_fehler.txt | grep -qxF "$1"
          }

          neu=0
          while IFS= read -r zeile; do
            quelle="${zeile#*!!   }"
            quelle="${quelle%%:*}"
            if ! bekannt "$quelle"; then
              echo "NEU (nicht in bekannte_fehler.txt): $zeile"
              neu=1
            fi
          done < <(grep '!!' abruf.log || true)

          if [ "$neu" = "1" ]; then
            echo "--- Mindestens eine neue, unbekannte Fehlerquelle -- Lauf schlaegt fehl. ---"
            exit 1
          fi
          echo "Keine neuen Fehler -- nur bereits bekannte Bot-Abwehr-Faelle (siehe daten/bekannte_fehler.txt)."
